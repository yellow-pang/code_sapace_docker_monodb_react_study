<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Ajax 실시간 채팅</title>

  <style>
    /* 전체 문서의 기본 폰트를 sans-serif로 지정합니다. */
    body {
      font-family: sans-serif;
    }

    /*
      채팅 메시지가 출력될 영역입니다.
      높이를 고정하고 overflow-y: auto를 줘서 메시지가 많아지면 스크롤됩니다.
    */
    #log {
      width: 520px;
      height: 320px;
      border: 1px solid #ccc;
      padding: 8px;
      overflow-y: auto;
    }

    /* 입력 영역 사이에 위쪽 여백을 줍니다. */
    .row {
      margin-top: 8px;
    }

    /* input 기본 여백 */
    input {
      padding: 6px;
    }

    /* button 기본 여백 */
    button {
      padding: 6px 10px;
    }

    /* 메시지 한 줄마다 위아래 간격을 줍니다. */
    .msg {
      margin: 4px 0;
    }
  </style>
</head>

<body>
  <h1>Ajax 실시간 채팅</h1>

  <!-- 서버에서 받아온 메시지들이 누적 출력되는 영역입니다. -->
  <div id="log"></div>

  <!-- 사용자 이름 입력 영역입니다. -->
  <div class="row">
    <input id="user" type="text" placeholder="이름" value="Kang" />
  </div>

  <!-- 메시지 입력 및 전송 버튼 영역입니다. -->
  <div class="row">
    <input id="text" type="text" placeholder="메시지" style="width: 420px;" />
    <button id="send">전송</button>
  </div>

  <script>
    // 채팅 API의 기본 주소입니다.
    // server.js에서 "/chat" 아래에 chatApp을 연결했기 때문에 기본 주소가 /chat입니다.
    var baseUrl = "http://localhost:3000/chat";

    // 메시지 출력 영역 DOM을 가져옵니다.
    var log = document.getElementById("log");

    // 사용자 이름 input DOM을 가져옵니다.
    var userEl = document.getElementById("user");

    // 메시지 내용 input DOM을 가져옵니다.
    var textEl = document.getElementById("text");

    // 전송 버튼 DOM을 가져옵니다.
    var sendBtn = document.getElementById("send");

    // 클라이언트가 마지막으로 받은 메시지 id입니다.
    // 처음에는 아무 메시지도 받지 않았으므로 0입니다.
    var lastId = 0;

    /*
      서버에서 받은 메시지 하나를 화면에 추가하는 함수입니다.

      m 예시:
      {
        id: 1,
        user: "Kang",
        text: "안녕하세요",
        dateStr: "2026-02-03 17:20:11"
      }
    */
    function appendMessage(m) {
      // 메시지 한 줄을 담을 div 요소를 새로 만듭니다.
      var div = document.createElement("div");

      // CSS 적용을 위해 class 이름을 msg로 지정합니다.
      div.className = "msg";

      // 메시지 내용을 텍스트로 넣습니다.
      // textContent를 사용하면 HTML 태그가 실행되지 않기 때문에 innerHTML보다 안전합니다.
      div.textContent =
        "[" + m.id + "] " +
        m.dateStr +
        " / " +
        m.user +
        ": " +
        m.text;

      // 만든 div를 log 영역의 마지막 자식으로 추가합니다.
      log.appendChild(div);

      // 새 메시지가 추가되면 스크롤을 가장 아래로 내립니다.
      log.scrollTop = log.scrollHeight;
    }

    /*
      GET 요청을 보내고 JSON 응답을 받는 공통 함수입니다.

      url:
      요청을 보낼 주소

      onOk:
      요청이 성공했을 때 실행할 콜백 함수
    */
    function getJson(url, onOk) {
      // XMLHttpRequest 객체를 생성합니다.
      var xhr = new XMLHttpRequest();

      // 요청 상태가 바뀔 때마다 실행되는 이벤트 핸들러입니다.
      xhr.onreadystatechange = function () {
        // readyState === 4는 요청이 완료되었다는 뜻입니다.
        if (xhr.readyState === 4) {
          // HTTP 상태 코드 200은 성공을 의미합니다.
          if (xhr.status === 200) {
            // 서버에서 받은 JSON 문자열을 JavaScript 객체로 변환합니다.
            // 그리고 성공 콜백으로 전달합니다.
            onOk(JSON.parse(xhr.responseText));
          }
        }
      };

      // GET 방식으로 비동기 요청을 준비합니다.
      // 세 번째 인자 true는 비동기 요청을 의미합니다.
      xhr.open("GET", url, true);

      // 실제 요청을 서버로 보냅니다.
      xhr.send();
    }

    /*
      POST 요청으로 JSON 데이터를 보내고 JSON 응답을 받는 공통 함수입니다.

      url:
      요청을 보낼 주소

      bodyObj:
      서버로 보낼 JavaScript 객체

      onOk:
      요청 성공 시 실행할 함수

      onErr:
      요청 실패 시 실행할 함수
    */
    function postJson(url, bodyObj, onOk, onErr) {
      // XMLHttpRequest 객체를 생성합니다.
      var xhr = new XMLHttpRequest();

      // 요청 상태가 바뀔 때마다 실행됩니다.
      xhr.onreadystatechange = function () {
        // 요청이 완료되었을 때
        if (xhr.readyState === 4) {
          // 성공이면 응답 JSON을 객체로 변환해서 onOk에 전달합니다.
          if (xhr.status === 200) {
            onOk(JSON.parse(xhr.responseText));
          }
          // 실패이면 onErr 함수가 있을 때만 실행합니다.
          else {
            onErr && onErr(xhr.responseText);
          }
        }
      };

      // POST 방식 비동기 요청을 준비합니다.
      xhr.open("POST", url, true);

      // 서버에게 "내가 보내는 데이터는 JSON입니다"라고 알려줍니다.
      xhr.setRequestHeader("Content-Type", "application/json");

      // JavaScript 객체를 JSON 문자열로 변환해서 서버로 보냅니다.
      xhr.send(JSON.stringify(bodyObj));
    }

    /*
      1) 최초 로드

      화면이 처음 열렸을 때 서버에 저장된 전체 메시지를 가져옵니다.
      요청 주소:
      GET http://localhost:3000/chat/
    */
    getJson(baseUrl + "/", function (data) {
      // 서버 응답에서 messages 배열을 가져옵니다.
      // 혹시 없으면 빈 배열을 사용합니다.
      var list = data.messages || [];

      // 기존 메시지를 화면에 하나씩 출력합니다.
      for (var i = 0; i < list.length; i++) {
        appendMessage(list[i]);
      }

      // 서버가 알려준 마지막 메시지 id를 저장합니다.
      lastId = data.lastId || 0;
    });

    /*
      2) 0.5초마다 새 메시지 확인

      이것이 Ajax 폴링의 핵심입니다.
      브라우저가 0.5초마다 서버에 물어봅니다.

      "내가 마지막으로 받은 메시지는 lastId번입니다.
       그 이후 메시지가 있나요?"
    */
    setInterval(function () {
      // lastId 이후의 새 메시지만 요청합니다.
      getJson(baseUrl + "/poll/" + lastId, function (data) {
        // 새 메시지 목록을 가져옵니다.
        var list = data.messages || [];

        // 새 메시지가 있을 때만 화면에 추가합니다.
        if (list.length > 0) {
          for (var i = 0; i < list.length; i++) {
            appendMessage(list[i]);
          }

          // 마지막으로 받은 메시지 id를 갱신합니다.
          lastId = data.lastId || lastId;
        }
      });
    }, 500);

    /*
      3) 메시지 전송 함수

      사용자가 전송 버튼을 누르거나 Enter를 누르면 실행됩니다.
    */
    function sendMessage() {
      // 사용자 이름을 읽고 앞뒤 공백을 제거합니다.
      var user = userEl.value.trim();

      // 메시지 내용을 읽고 앞뒤 공백을 제거합니다.
      var text = textEl.value.trim();

      // 이름이나 메시지가 비어 있으면 전송하지 않습니다.
      if (!user || !text) {
        return;
      }

      // POST /chat/send로 메시지를 전송합니다.
      postJson(
        baseUrl + "/send",
        {
          user: user,
          text: text,
        },
        function () {
          // 전송 성공 후 메시지 입력창을 비웁니다.
          textEl.value = "";

          // 다시 메시지 입력창에 포커스를 줍니다.
          textEl.focus();

          /*
            원래는 setInterval 폴링이 0.5초 안에 새 메시지를 가져옵니다.

            하지만 사용자가 전송 버튼을 눌렀을 때 바로 보이는 느낌을 주기 위해
            전송 성공 직후 한 번 더 즉시 poll 요청을 보냅니다.
          */
          getJson(baseUrl + "/poll/" + lastId, function (data) {
            var list = data.messages || [];

            for (var i = 0; i < list.length; i++) {
              appendMessage(list[i]);
            }

            lastId = data.lastId || lastId;
          });
        }
      );
    }

    // 전송 버튼을 클릭하면 sendMessage 함수를 실행합니다.
    sendBtn.addEventListener("click", sendMessage);

    // 메시지 입력창에서 키보드를 눌렀을 때 실행됩니다.
    textEl.addEventListener("keydown", function (e) {
      // Enter 키를 누르면 메시지를 전송합니다.
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
